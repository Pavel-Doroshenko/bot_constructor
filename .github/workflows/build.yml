name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository (to get docker-compose and nginx configs)
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx conf to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "~/app"
          rm: false

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY,GHCR_PAT,RAW_ACTOR,RAW_REPO_OWNER
          script: |
            mkdir -p ~/app && cd ~/app
            
            # Переводим логин в нижний регистр средствами Bash самого сервера VPS
            GH_ACTOR=$(echo "$RAW_ACTOR" | tr '[:upper:]' '[:lower:]')
            GH_REPO_OWNER=$(echo "$RAW_REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            
            # Авторизуем Docker на сервере
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            
            # Создаем файл .env с правильным регистром переменных
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
            echo "GITHUB_REPOSITORY_OWNER=$GH_REPO_OWNER" >> .env
            
            # Скачиваем свежий образ и перезапускаем
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Чистим систему от старых слоев
            docker image prune -f
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          RAW_ACTOR: ${{ github.actor }}
          RAW_REPO_OWNER: ${{ github.repository_owner }}

