name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose and nginx conf to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "~/app"
          rm: false # Не удалять другие файлы в папке, если они там есть

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Безопасно передаем переменные окружения внутрь скрипта
          envs: OPENAI_API_KEY,GHCR_PAT,GH_ACTOR,GH_REPO_OWNER
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }} # Новый секрет (PAT токен) вместо GITHUB_TOKEN
          GH_ACTOR: ${{ github.actor }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
          
          script: |
            # Создаем папку, если её нет, и переходим
            mkdir -p ~/app && cd ~/app
            
            # Авторизуем Docker через безопасную переменную PAT
            echo "$GHCR_PAT" | docker login ghcr.io -u $GH_ACTOR --password-stdin
            
            # Безопасно формируем .env (переменные берутся из окружения системы, а не из текста команды)
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
            echo "GITHUB_REPOSITORY_OWNER=$GH_REPO_OWNER" >> .env
            
            # Обновляем и запускаем
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Чистим систему от старых слоев
            docker image prune -f

